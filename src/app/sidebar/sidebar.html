<aside class="w-64 h-full bg-base-200 p-4 flex flex-col items-center gap-4">
  <div
    class="flex items-center gap-2 justify-center w-full p-4 bg-base-300 border border-base-100 rounded-md"
  >
    <app-icon name="featherMonitor" size="24" />
    <h1 class="text-lg font-bold">No-Code</h1>
  </div>
  <form id="add-container-form" (submit)="addContainer($event)">
    <label class="label" for="content">Container content</label>
    <textarea
      class="textarea textarea-bordered w-full"
      rows="10"
      id="content"
      [formControl]="containerContent"
    ></textarea>
  </form>
  <button class="btn btn-primary w-full" form="add-container-form" type="submit">
    Add container
    <app-icon name="featherPlus" size="20" />
  </button>
  <hr class="w-full" />
  <button class="btn btn-primary w-full" (click)="exportSetup()" type="button">
    Export setup
    <app-icon name="featherDownload" size="20" />
  </button>
  <button class="btn btn-primary w-full" (click)="triggerImport()" type="button">
    Import setup
    <app-icon name="featherUpload" size="20" />
  </button>
  <input type="file" (change)="importSetup($event)" id="import-file" hidden />
</aside>
