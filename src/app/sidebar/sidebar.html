<aside class="w-64 h-full bg-base-300 p-4 flex flex-col items-center gap-6">
  <div class="flex items-center justify-center gap-3 pt-2 w-full">
    <app-icon name="phosphorPackageDuotone" size="24" class="mt-0.5" />
    <h1 class="text-lg font-bold mb-0.5">No-Code</h1>
  </div>
  <form id="add-container-form" (submit)="addContainer($event)">
    <label class="label" for="content">Text</label>
    <textarea
      class="textarea textarea-bordered w-full"
      rows="10"
      id="content"
      [formControl]="containerContent"
    ></textarea>
  </form>
  <button class="btn btn-primary w-full gap-2" form="add-container-form" type="submit">
    <app-icon name="phosphorPlusBold" size="18" class="mt-0.5" />
    Add container
  </button>
  <hr class="w-full border-neutral-500" />
  <button class="btn btn-primary w-full gap-2" (click)="exportSetup()" type="button">
    <app-icon name="phosphorArrowSquareOutBold" size="18" class="mt-0.5" />
    Export setup
  </button>
  <button class="btn btn-primary w-full gap-2" (click)="triggerImport()" type="button">
    <app-icon name="phosphorFolderOpenBold" size="18" class="mt-0.5" />
    Import setup
  </button>
  <input type="file" (change)="importSetup($event)" id="import-file" hidden />
</aside>
