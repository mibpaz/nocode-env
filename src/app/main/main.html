<div class="flex h-full">
  <app-sidebar
    (onAddContainer)="onAddContainer($event)"
    (onExport)="exportSetup()"
    (onImport)="importSetup($event)"
  />
  <section class="flex-1 grid-bg">
    <gridster #gridster [options]="options" style="background-color: var(--color-base-100)">
      @for (item of items; track item['id']) {
      <app-grid-item [item]="item" (removeItem)="removeItem(item)" />
      }
    </gridster>
  </section>
</div>
